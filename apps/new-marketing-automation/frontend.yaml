apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketing-automation-frontend
  namespace: new-marketing-automation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: new-marketing-automation
      component: frontend
  template:
    metadata:
      labels:
        app: new-marketing-automation
        component: frontend
        app.kubernetes.io/name: new-marketing-automation
        app.kubernetes.io/instance: new-marketing-automation
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: marketing-automation
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/danavira/new-marketing-automation-frontend:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /login
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
