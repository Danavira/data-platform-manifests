apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# Single place to bump the deployed version. The build workflow in the
# danavira-website repo publishes :sha-<short> on every push to main and
# :<version> on a v* tag; this tracks the tagged releases.
images:
  - name: ghcr.io/danavira/danavira-website
    newTag: "0.1.0"
