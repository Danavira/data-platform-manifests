apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# The deployed version. The build workflow in the danavira-website repo
# publishes :sha-<short> on every push to main and :<version> on a v* tag.
# argocd-image-updater (apps/image-updater-config) commits the newest :sha-
# tag here automatically; edit by hand only to pin or roll back.
images:
  - name: ghcr.io/danavira/danavira-website
    newTag: sha-7aca659
    newName: ghcr.io/danavira/danavira-website
